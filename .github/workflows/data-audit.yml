name: Data audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs && mkdir -p data && mv audit.json data/audit.json
      - name: Save results to the repo
        run: |
          git config user.name "woolmer-bot"
          git config user.email "hello@woolmer.info"
          git add data/audit.json
          git commit -m "Data audit snapshot [skip ci]" || echo "no change"
          git push

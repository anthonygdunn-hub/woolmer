name: Data audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: audit
          path: audit.json
          retention-days: 3

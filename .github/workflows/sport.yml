name: Local sport results (FA Full-Time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-sport.mjs
      - run: |
          git config user.name "woolmer-bot"; git config user.email "hello@woolmer.info"
          git add data/sport-raw; git commit -m "Sport data snapshot [skip ci]" || echo "no change"; git push
